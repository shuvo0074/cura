# Local development dependencies for the Cura API.
#
#   docker compose up -d      start
#   docker compose ps         check health
#   docker compose down       stop (data survives)
#
# Data lives in named volumes, so stopping the stack does not lose your
# database. Credentials here are development-only and deliberately weak —
# production connection strings come from your platform's secret manager.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cura
      POSTGRES_PASSWORD: cura
      POSTGRES_DB: cura
      # Deterministic collation so `text_pattern_ops` prefix search behaves the
      # same on every developer machine and in CI.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - cura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cura -d cura']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cura-redis
    restart: unless-stopped
    # Persistence off: everything Redis holds here is disposable cache and
    # rate-limit state, so there is nothing worth surviving a restart.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cura-postgres-data:
